<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0d14">
  <title>Manga Library</title>
  <style>
    :root{
      --bg:#080a10;--panel:rgba(18,21,31,.78);--panel2:rgba(25,29,42,.72);
      --border:rgba(255,255,255,.09);--text:#f4f6fb;--muted:#9299aa;
      --accent:#a78bfa;--accent2:#60a5fa;--danger:#fb7185;--good:#4ade80;
      --shadow:0 18px 60px rgba(0,0,0,.35);--radius:22px;
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:
      radial-gradient(circle at 15% 0%,rgba(167,139,250,.13),transparent 28%),
      radial-gradient(circle at 85% 10%,rgba(96,165,250,.10),transparent 25%),
      var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    button,input,select{font:inherit}
    button{cursor:pointer}
    .wrap{width:min(1180px,calc(100% - 28px));margin:auto}
    header{padding:34px 0 24px;position:relative}
    .top{display:block}
    .eyebrow{color:var(--accent);font-size:18px;font-weight:1000;letter-spacing:.2em;text-transform:uppercase;text-align:center;margin-bottom:22px}
    h1{font-size:clamp(34px,6vw,62px);line-height:1;margin:10px 0 12px;letter-spacing:-.05em}
    .subtitle{color:var(--muted);max-width:680px;line-height:1.7;margin:0 auto;text-align:center}
    .theme{position:absolute;right:0;top:0;border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:14px;backdrop-filter:blur(16px)}
    .toolbar{margin:26px 0 20px;padding:14px;border:1px solid var(--border);background:var(--panel);box-shadow:var(--shadow);border-radius:var(--radius);backdrop-filter:blur(18px)}
    .search{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.045);border:1px solid var(--border);padding:0 15px;border-radius:15px}
    .search input{width:100%;border:0;outline:0;background:transparent;color:var(--text);padding:15px 0}
    .filters{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
    .filter{border:1px solid var(--border);background:rgba(255,255,255,.035);color:var(--muted);padding:9px 13px;border-radius:12px;transition:.2s}
    .filter:hover,.filter.active{color:#fff;background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.4)}
    .sort{margin-left:auto;border:1px solid var(--border);background:rgba(255,255,255,.04);color:var(--text);padding:9px 12px;border-radius:12px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}
    .stat{padding:19px;border:1px solid var(--border);border-radius:18px;background:var(--panel);box-shadow:var(--shadow)}
    .stat b{display:block;font-size:28px;margin-bottom:5px}.stat span{color:var(--muted);font-size:13px}
    .section-head{display:flex;justify-content:space-between;align-items:center;margin:32px 0 14px}
    .section-head h2{margin:0;font-size:21px}.count{color:var(--muted);font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding-bottom:60px}
    .card{position:relative;overflow:hidden;border:1px solid var(--border);background:linear-gradient(145deg,var(--panel2),rgba(12,14,21,.84));border-radius:20px;padding:20px;transition:transform .25s,border-color .25s,box-shadow .25s;animation:rise .35s both}
    .card:hover{transform:translateY(-4px);border-color:rgba(167,139,250,.3);box-shadow:0 20px 50px rgba(0,0,0,.28)}
    .card-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .title{font-size:19px;font-weight:750;line-height:1.3}.meta{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}
    .pill{font-size:11px;padding:5px 8px;border-radius:999px;background:rgba(255,255,255,.055);color:#b9c0cf;border:1px solid var(--border)}
    .status{color:#d9cfff}.status.Completed{color:var(--good)}.status.Hiatus{color:#fbbf24}.status.Dropped{color:var(--danger)}
    .heart{border:0;background:transparent;color:#72798b;font-size:21px;padding:0}.heart.on{color:#fb7185}
    .desc{color:var(--muted);font-size:13px;line-height:1.55;min-height:40px}
    .row{display:flex;justify-content:space-between;color:#aeb5c5;font-size:12px;margin:15px 0 7px}
    .bar{height:7px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
    .fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .6s}
    .actions{display:flex;gap:8px;margin-top:16px}
    .btn{flex:1;border:1px solid var(--border);background:rgba(255,255,255,.045);color:#e8eaf0;padding:9px 11px;border-radius:11px;transition:.2s}
    .btn:hover{background:rgba(255,255,255,.09)}
    .btn.primary{background:rgba(167,139,250,.14);border-color:rgba(167,139,250,.3)}
    .empty{grid-column:1/-1;text-align:center;padding:60px 20px;border:1px dashed var(--border);border-radius:20px;color:var(--muted)}
    .modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;padding:18px;z-index:10;backdrop-filter:blur(8px)}
    .modal.show{display:flex}.dialog{width:min(600px,100%);background:#11141d;border:1px solid var(--border);border-radius:22px;padding:24px;box-shadow:0 30px 100px rgba(0,0,0,.5)}
    .dialog h2{margin-top:0}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}
    .field label{font-size:12px;color:var(--muted)}.field input,.field select{border:1px solid var(--border);background:#191d28;color:var(--text);padding:11px;border-radius:11px;outline:none}
    .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
    .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#f4f6fb;color:#111;padding:11px 16px;border-radius:12px;font-size:13px;transition:.25s;z-index:20}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
    @media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:580px){.wrap{width:min(100% - 18px,1180px)}header{padding-top:28px}.top{display:block}.eyebrow{font-size:15px;margin-bottom:18px}.theme{position:static;margin-top:18px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:23px}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.sort{margin-left:0;width:100%}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="top">
        <div>
          <div class="eyebrow">Personal Library</div>
          <p class="subtitle">Your manga, manhwa and manhua collection — organized, searchable and easy to update.</p>
        </div>
        <button class="theme" id="addBtn">＋ Add title</button>
      </div>
    </header>

    <section class="toolbar">
      <div class="search">
        <span>⌕</span>
        <input id="search" type="search" placeholder="Search titles...">
      </div>
      <div class="filters" id="typeFilters">
        <button class="filter active" data-type="All">All</button>
        <button class="filter" data-type="Manga">Manga</button>
        <button class="filter" data-type="Manhwa">Manhwa</button>
        <button class="filter" data-type="Manhua">Manhua</button>
        <button class="filter" data-status="Reading">Reading</button>
        <button class="filter" data-status="Completed">Completed</button>
        <button class="filter" data-status="Hiatus">Hiatus</button>
        <button class="filter" data-status="Dropped">Dropped</button>
        <select class="sort" id="sort">
          <option value="recent">Recently added</option>
          <option value="az">A–Z</option>
          <option value="za">Z–A</option>
          <option value="chapters">Most chapters</option>
        </select>
      </div>
    </section>

    <section class="stats">
      <div class="stat"><b id="total">0</b><span>Total titles</span></div>
      <div class="stat"><b id="reading">0</b><span>Reading</span></div>
      <div class="stat"><b id="completed">0</b><span>Completed</span></div>
      <div class="stat"><b id="chapters">0</b><span>Chapters watched</span></div>
    </section>

    <div class="section-head">
      <h2>My Collection</h2><span class="count" id="count"></span>
    </div>
    <section class="grid" id="grid"></section>
  </main>

  <div class="modal" id="modal">
    <div class="dialog">
      <h2>Add a title</h2>
      <form id="form">
        <div class="form">
          <div class="field full"><label>Title</label><input id="fTitle" required placeholder="e.g. Solo Leveling"></div>
          <div class="field"><label>Type</label><select id="fType"><option>Manga</option><option>Manhwa</option><option>Manhua</option></select></div>
          <div class="field"><label>Status</label><select id="fStatus"><option>Reading</option><option>Completed</option><option>Hiatus</option><option>Dropped</option></select></div>
          <div class="field"><label>Current chapter watched</label><input id="fChapters" type="number" min="0" value="0"></div>
          <div class="field full"><label>Description (optional)</label><input id="fDesc" placeholder="Short note about the title"></div>
        </div>
        <div class="modal-actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary">Add title</button></div>
      </form>
    </div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    /*
      ================================
      ADD YOUR TITLES HERE
      ================================
      You can add as many as you want.
      The website automatically creates
      the cards, search, filters and stats.
    */
    const mangaList = [
      { title:"Solo Leveling", type:"Manhwa", status:"Completed", chapters:200, description:"A hunter rises from the weakest rank to something far beyond human." },
      { title:"One Piece", type:"Manga", status:"Reading", chapters:1170, description:"A pirate adventure following Luffy and his crew toward the legendary One Piece." },
      { title:"Omniscient Reader", type:"Manhwa", status:"Reading", chapters:280, description:"A reader discovers that the novel he finished has become reality." },
      { title:"The Beginning After the End", type:"Manhwa", status:"Reading", chapters:250, description:"A king is reincarnated into a world of magic and monsters." },
      { title:"Reverend Insanity", type:"Manhua", status:"Hiatus", chapters:2334, description:"A ruthless cultivation story centered on Fang Yuan and his pursuit of immortality." },
      { title:"Naruto", type:"Manga", status:"Completed", chapters:700, description:"A young ninja seeks recognition while carrying a dangerous secret." }
    ];

    const KEY = "manga-library-v1";
    let saved = JSON.parse(localStorage.getItem(KEY) || "null");
    let items = saved || mangaList.map((x,i)=>({...x,id:i+1, favorite:false, added:i}));
    let activeType = "All", activeStatus = null, query = "";

    const $ = s => document.querySelector(s);
    const grid = $("#grid");

    function save(){ localStorage.setItem(KEY, JSON.stringify(items)); }

    function render(){
      let list = [...items].filter(x => {
        const matchesQuery = x.title.toLowerCase().includes(query.toLowerCase());
        const matchesType = activeType==="All" || x.type===activeType;
        const matchesStatus = !activeStatus || x.status===activeStatus;
        return matchesQuery && matchesType && matchesStatus;
      });
      const sort=$("#sort").value;
      if(sort==="az") list.sort((a,b)=>a.title.localeCompare(b.title));
      if(sort==="za") list.sort((a,b)=>b.title.localeCompare(a.title));
      if(sort==="chapters") list.sort((a,b)=>b.chapters-a.chapters);
      if(sort==="recent") list.sort((a,b)=>(b.added||0)-(a.added||0));

      grid.innerHTML = list.length ? list.map(card).join("") :
        '<div class="empty">No titles found.<br><small>Try another search or filter.</small></div>';

      $("#count").textContent = `${list.length} title${list.length===1?"":"s"}`;
      updateStats();
    }

    function card(x){
      return `<article class="card">
        <div class="card-top">
          <div>
            <div class="title">${escapeHtml(x.title)}</div>
            <div class="meta">
              <span class="pill">${escapeHtml(x.type)}</span>
              <span class="pill status ${escapeHtml(x.status)}">${escapeHtml(x.status)}</span>
            </div>
          </div>
          <button class="heart ${x.favorite?"on":""}" onclick="toggleFav(${x.id})" title="Favorite">♥</button>
        </div>
        <div class="desc">${escapeHtml(x.description || "No description added.")}</div>
        <div class="row"><span>Current chapter watched</span><span>Chapter ${Number(x.chapters).toLocaleString()}</span></div>
        <div class="actions">
          <button class="btn primary" onclick="editProgress(${x.id})">Update current chapter</button>
          <button class="btn" onclick="removeTitle(${x.id})">Remove</button>
        </div>
      </article>`;
    }

    function updateStats(){
      $("#total").textContent=items.length;
      $("#reading").textContent=items.filter(x=>x.status==="Reading").length;
      $("#completed").textContent=items.filter(x=>x.status==="Completed").length;
      $("#chapters").textContent=items.reduce((a,x)=>a+Number(x.chapters||0),0).toLocaleString();
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
    }

    function toggleFav(id){
      const x=items.find(x=>x.id===id); if(!x)return;
      x.favorite=!x.favorite; save(); render();
    }

    function editProgress(id){
      const x=items.find(x=>x.id===id); if(!x)return;
      const p=prompt(`Current chapter watched for "${x.title}":`,x.chapters);
      if(p===null)return;
      const n=Math.max(0,Number(p));
      if(Number.isNaN(n))return;
      x.chapters=n;
      save();render();toast("Current chapter updated");
    }

    function removeTitle(id){
      const x=items.find(x=>x.id===id); if(!x)return;
      if(!confirm(`Remove "${x.title}" from your library?`))return;
      items=items.filter(x=>x.id!==id);save();render();toast("Title removed");
    }

    $("#search").addEventListener("input",e=>{query=e.target.value;render()});
    $("#sort").addEventListener("change",render);

    document.querySelectorAll(".filter").forEach(btn=>{
      btn.addEventListener("click",()=>{
        document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
        activeType=btn.dataset.type || "All";
        activeStatus=btn.dataset.status || null;
        render();
      });
    });

    const modal=$("#modal");
    $("#addBtn").onclick=()=>modal.classList.add("show");
    $("#cancel").onclick=()=>modal.classList.remove("show");
    modal.addEventListener("click",e=>{if(e.target===modal)modal.classList.remove("show")});

    $("#form").addEventListener("submit",e=>{
      e.preventDefault();
      items.unshift({
        id:Date.now(), title:$("#fTitle").value.trim(), type:$("#fType").value,
        status:$("#fStatus").value, chapters:Number($("#fChapters").value)||0,
        description:$("#fDesc").value.trim(), favorite:false, added:Date.now()
      });
      save(); render(); e.target.reset(); modal.classList.remove("show"); toast("Title added");
    });

    function toast(msg){
      const t=$("#toast");t.textContent=msg;t.classList.add("show");
      setTimeout(()=>t.classList.remove("show"),1800);
    }

    render();
  </script>
</body>
</html>
